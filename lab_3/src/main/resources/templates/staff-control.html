<!doctype html>
<html lang=vi xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <style>
        .rdo-css{
            display: block;
            text-align: center;
            margin: 10px;
            padding: 5px;
            border: 1px solid #ccc;
            height: 30px;
            width: 200px;
            color:blue;
        }
        .rdo-css:hover{
             background-color: #ccc;
            cursor: pointer;
            color: red;
            border: 1px solid red;
            border-radius: 5px;
            transition: 0.5s;
            transform: scale(1.1);
            z-index: 1;
            position: relative;
         }
    .form-control{
        width: 200px;
        margin: 10px;
        padding: 5px;
        display: inline-block;
        border: 1px solid #ccc;
        background-color: green;
    }

    </style>
</head>
<body>
<h3>Fill to SelectBox</h3>
<label>
    <select name="cbo" class="form-control">
        <th:block th:each="staff : ${list}">
            <option th:value="${staff.id}" th:text="${staff.name}"></option>
        </th:block>
    </select>
</label>
<h3>Create a Radio Button Group</h3>
<th:block th:each="staff : ${list}" >
    <label class="rdo-css">
        <input type="radio" name="rdo" th:value="${staff.id}">
         <th:block th:text="${staff.name}"></th:block>
    </label>
    <br>
</th:block>
</body>
</html>
