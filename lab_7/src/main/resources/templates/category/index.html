<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category Management</title>
    <style>
        .alert { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h3>CATEGORY MANAGEMENT</h3>
    
    <!-- Navigation Links -->
    <div>
        <a href="/product/sort">Product Sorting</a> | 
        <a href="/product/page">Product Pagination</a>
    </div>
    
    <hr>
    
    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    
    <!-- Include Form Fragment -->
    <th:block th:replace="category/form :: categoryForm" />
    
    <hr>
    
    <!-- Include Table Fragment -->
    <th:block th:replace="category/table :: categoryTable" />
    
</body>
</html>
