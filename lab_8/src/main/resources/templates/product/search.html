<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Search</title>
</head>
<body>
    <h3>PRODUCT SEARCH BY PRICE RANGE</h3>
    
    <!-- Search Form -->
    <form action="/product/search" method="get">
        <div>
            <label>Min Price:</label>
            <input name="min" th:value="${param.min}" placeholder="Min Price?" type="number">
        </div>
        <div>
            <label>Max Price:</label>
            <input name="max" th:value="${param.max}" placeholder="Max Price?" type="number">
        </div>
        <button type="submit">Search</button>
        <a href="/product/search">Clear</a>
    </form>
    
    <hr>
    
    <!-- Search Results -->
    <div th:if="${items != null}">
        <h4>Search Results (<span th:text="${#lists.size(items)}"></span> products found)</h4>
        
        <div th:if="${not #lists.isEmpty(items)}">
            <table border="1" style="width:100%">
                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Create Date</th>
                    <th>Available</th>
                    <th>Category</th>
                </tr>
                <tr th:each="item: ${items}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}"></td>
                    <td th:text="${item.createDate}"></td>
                    <td th:text="${item.available ? 'Yes' : 'No'}"></td>
                    <td th:text="${item.category != null ? item.category.name : 'N/A'}"></td>
                </tr>
            </table>
        </div>
        
        <div th:if="${#lists.isEmpty(items)}">
            <p>No products found in the specified price range.</p>
        </div>
    </div>
    
    <div th:if="${items == null}">
        <p>Enter price range to search for products.</p>
    </div>
    
    <hr>
    
    <p>
        <a href="/product/search-and-page">Search with Pagination</a> | 
        <a href="/product/page">Product Pagination</a> | 
        <a href="/category/index">Back to Category Management</a>
    </p>
</body>
</html>
