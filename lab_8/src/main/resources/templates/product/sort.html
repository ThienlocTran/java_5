<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Sort</title>
</head>
<body>
    <h3>PRODUCT SORTING</h3>
    
    <!-- Sort Options -->
    <div>
        <h4>Sort by:</h4>
        <a href="/product/sort">All Products</a> |
        <a href="/product/sort?field=name">Sort by Name</a> |
        <a href="/product/sort?field=price">Sort by Price</a> |
        <a href="/product/sort?field=createDate">Sort by Date</a>
    </div>
    
    <p><strong>Current sort:</strong> <span th:text="${field}"></span></p>
    
    <hr>
    
    <!-- Products Table -->
    <div th:if="${items != null and !items.empty}">
        <table border="1" style="width:100%">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Create Date</th>
                <th>Available</th>
                <th>Category</th>
            </tr>
            <tr th:each="item: ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${item.createDate}"></td>
                <td th:text="${item.available ? 'Yes' : 'No'}"></td>
                <td th:text="${item.category?.name ?: 'N/A'}"></td>
            </tr>
        </table>
    </div>
    
    <div th:if="${items == null or items.empty}">
        <p>No products found.</p>
    </div>
    
    <hr>
    
    <!-- Custom Sort Form -->
    <div>
        <h4>Custom Sort:</h4>
        <form action="/product/sort" method="get">
            <label>Sort by field:</label>
            <select name="field">
                <option value="name">Name</option>
                <option value="price">Price</option>
                <option value="createDate">Create Date</option>
                <option value="id">ID</option>
            </select>
            <button type="submit">Sort</button>
        </form>
    </div>
    
    <p><a href="/product/page">Product Pagination</a> | <a href="/category/index">Back to Category Management</a></p>
</body>
</html>
