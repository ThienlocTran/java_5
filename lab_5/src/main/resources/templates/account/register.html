<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <h2>Đăng ký tài khoản</h2>
    
    <form action="/account/register" method="post" enctype="multipart/form-data">
        <p>
            <label>Username:</label><br>
            <input type="text" name="username" required>
        </p>
        
        <p>
            <label>Password:</label><br>
            <input type="password" name="password" required>
        </p>
        
        <p>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </p>
        
        <p>
            <label>Họ tên:</label><br>
            <input type="text" name="fullname" required>
        </p>
        
        <p>
            <label>Ảnh đại diện:</label><br>
            <input type="file" name="photo" accept="image/*" required>
        </p>
        
        <p>
            <button type="submit">Đăng ký</button>
        </p>
    </form>
    
    <div th:if="${session.registered_username}">
        <h3>Đăng ký thành công!</h3>
        <p>Username: <span th:text="${session.registered_username}"></span></p>
        <p>Email: <span th:text="${session.registered_email}"></span></p>
        <p>Họ tên: <span th:text="${session.registered_fullname}"></span></p>
        <p>Ảnh đã lưu: <span th:text="${session.registered_photo}"></span></p>
    </div>
</body>
</html>
