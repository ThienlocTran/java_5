<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
</head>
<body>
    <h2>Giỏ hàng</h2>
    
    <table border="1" style="width:100%">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
            <th></th>
        </tr>
        <tr th:each="item: ${cart.items}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.price}"></td>
            <td>
                <form th:action="@{|/cart/update/${item.id}|}" method="post" style="display: inline;">
                    <input type="hidden" name="id" th:value="${item.id}">
                    <label>
                        <input name="qty" th:value="${item.qty}" onblur="this.form.submit()" style="width: 50px;">
                    </label>
                </form>
            </td>
            <td th:text="${item.price * item.qty}"></td>
            <td>
                <a th:href="@{|/cart/remove/${item.id}|}">Remove</a>
            </td>
        </tr>
    </table>
    
    <p>
        <a href="/cart/clear">Clear Cart</a>
        <a href="/item/index">Add more</a>
    </p>
</body>
</html>
